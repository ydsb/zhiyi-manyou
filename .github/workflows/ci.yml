name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend tests
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  nlp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nlp-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install numpy
      - name: Run NLP tests
        run: python tests/test_nlp.py
      - name: Evaluate semantic retrieval quality
        run: python tests/eval_match.py --json eval-match.json
      - name: Upload semantic evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nlp-eval-report
          path: nlp-service/eval-match.json
